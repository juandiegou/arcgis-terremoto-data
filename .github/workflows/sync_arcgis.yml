name: Sincronizar Reportes ArcGIS

on:
  schedule:
    # Cada hora (hora UTC)
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutar manualmente

permissions:
  contents: write # Necesario para hacer commit del archivo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Instalar requests
        run: pip install requests
      
      - name: Descargar datos de ArcGIS
        run: python sync_arcgis.py
        env:
          ARCGIS_USERNAME: ${{ secrets.ARCGIS_USERNAME }}
          ARCGIS_PASSWORD: ${{ secrets.ARCGIS_PASSWORD }}
      
      - name: Verificar archivo descargado
        run: |
          echo "=== Verificando data/reportes_terremoto.json ==="
          if [ -f "data/reportes_terremoto.json" ]; then
            echo "✅ Archivo encontrado!"
            echo "   Tamaño: $(wc -c < data/reportes_terremoto.json) bytes"
            echo "   Primeros 200 caracteres:"
            head -c 200 data/reportes_terremoto.json
          else
            echo "❌ El archivo NO existe"
            echo "=== Buscando archivos JSON en el repo ==="
            find . -name "*.json" -type f 2>/dev/null || echo "Ninguno encontrado"
            echo "=== Contenido del directorio actual ==="
            ls -la
            exit 1
          fi
      
      - name: Commit y push de los datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reportes_terremoto.json
          git commit -m "Sync ArcGIS: $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "No hay cambios"
          git push
